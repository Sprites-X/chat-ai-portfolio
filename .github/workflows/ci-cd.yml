# ============================================================
# CI/CD : Chat AI + Portfolio (BE + FE) บน GitHub Actions
#
# ทุก branch และทุก Pull Request : test-be, test-fe
# push เข้า main เท่านั้น       : test → build → scan → deploy ขึ้น Render
#                                 เฉพาะฝั่งที่โค้ดเปลี่ยน (แก้แค่ไฟล์ .md จะไม่ build/deploy)
#
# image ที่ยังไม่ผ่าน scan มีแค่ tag :SHA เท่านั้น
# :latest ถูกย้ายมาชี้ที่ image ตอน deploy (หลัง scan ผ่าน) และ Render ได้รับคำสั่งให้ deploy :SHA ตัวนั้นตรง ๆ
#
# ตั้งค่าที่ GitHub → Settings → Secrets and variables → Actions
#   Variables (ค่าธรรมดา)
#     DOCKERHUB_USERNAME      ชื่อบัญชี Docker Hub
#   Secrets (ค่าลับ ถูกซ่อนใน log อัตโนมัติ)
#     DOCKERHUB_TOKEN         Docker Hub access token
#     RENDER_DEPLOY_HOOK_BE   Deploy Hook URL ของ BE
#     RENDER_DEPLOY_HOOK_FE   Deploy Hook URL ของ FE
#
# ลำดับขั้นใช้ needs: job ถัดไปจะเริ่มก็ต่อเมื่อ job ก่อนหน้าผ่าน
# BE กับ FE แยกสายกัน ถ้าฝั่งหนึ่งพัง อีกฝั่งยัง deploy ได้
# ============================================================

name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

# ให้ token ของ workflow อ่าน repo ได้อย่างเดียว
permissions:
  contents: read

env:
  # ตัวสแกน Trivy ล็อกด้วย digest ไม่ใช่แค่ชื่อ tag เพราะ tag บน Docker Hub ถูกชี้ไปที่ image อื่นได้
  # (มีนาคม 2026 tag 0.69.4–0.69.6 และ latest ของ aquasec/trivy ถูกแทนด้วย image ที่ฝังมัลแวร์)
  # digest นี้คือ 0.58.0 ที่ push ไว้ตั้งแต่ 3 ธ.ค. 2024 ก่อนเหตุการณ์นั้น
  TRIVY_IMAGE: aquasec/trivy:0.58.0@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb

jobs:
  # ---------- ตรวจก่อนเริ่มว่าแต่ละฝั่งต้องทำอะไร ----------
  # has-xx     : มีโค้ดฝั่งนั้นแล้วหรือยัง ถ้ายังไม่มี job ฝั่งนั้นจะขึ้น skipped แทนที่จะพัง
  # xx-changed : push ครั้งนี้แก้โค้ดฝั่งนั้นไหม ถ้าไม่ได้แก้ก็ไม่ต้อง build/deploy ใหม่
  detect:
    runs-on: ubuntu-latest
    outputs:
      has-be: ${{ steps.check.outputs.has-be }}
      has-fe: ${{ steps.check.outputs.has-fe }}
      be-changed: ${{ steps.check.outputs.be-changed }}
      fe-changed: ${{ steps.check.outputs.fe-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ดึงประวัติ commit ทั้งหมด เพื่อเทียบว่าไฟล์ไหนเปลี่ยน
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }} # commit ล่าสุดของ branch ก่อน push ครั้งนี้
        run: |
          # รายชื่อไฟล์ที่ push ครั้งนี้แก้ (ไม่นับไฟล์ .md)
          # ถ้าเทียบไม่ได้ เช่น Pull Request, กดรันเอง หรือ push branch ใหม่ ให้ถือว่าเปลี่ยนทุกฝั่ง
          if [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=false
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -v '\.md$' || true)
          else
            all=true
            changed=""
          fi
          echo "ไฟล์โค้ดที่เปลี่ยน:"; echo "${changed:-(ไม่มี หรือเทียบไม่ได้)}"

          for app in be fe; do
            dir=$(echo "$app" | tr '[:lower:]' '[:upper:]')

            if [ -f "$dir/package.json" ]; then has=true; else has=false; fi

            # แก้ไฟล์ในโฟลเดอร์ของฝั่งนั้น หรือแก้ workflow เอง = ต้อง build ใหม่
            if [ "$all" = true ] || echo "$changed" | grep -Eq "^($dir/|\.github/workflows/)"; then
              chg=true
            else
              chg=false
            fi

            echo "has-$app=$has" >> "$GITHUB_OUTPUT"
            echo "$app-changed=$chg" >> "$GITHUB_OUTPUT"
            echo "$dir: has=$has changed=$chg"
          done

  # ================= BACKEND =================

  # ---------- STAGE: test (ทุก branch) ----------
  test-be:
    needs: detect
    if: needs.detect.outputs.has-be == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BE/package-lock.json
      - run: npm ci
      - name: ตรวจ syntax
        run: node --check index.js
      - name: รัน test (ไฟล์ *.test.js ในโฟลเดอร์ BE)
        run: node --test

  # ---------- STAGE: build (main เท่านั้น) ----------
  build-be:
    needs: [detect, test-be]
    # main เท่านั้น (เหมือน rules: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ใน GitLab) และโค้ด BE ต้องเปลี่ยน
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.detect.outputs.be-changed == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-be
    steps:
      - uses: actions/checkout@v7
      - name: login Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # runner เป็น Linux amd64 อยู่แล้ว จึงไม่ต้องระบุ --platform และไม่ต้องใช้ dind
      # push แค่ :SHA ยังไม่แตะ :latest จนกว่าจะผ่าน scan
      - name: build และ push :SHA
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA::7}" ./BE
          docker push "$IMAGE:${GITHUB_SHA::7}"

  # ---------- STAGE: scan ----------
  scan-be:
    needs: build-be
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-be
    steps:
      # รายงาน HIGH + CRITICAL ให้อ่าน ไม่ทำให้ job พัง
      - name: trivy รายงาน
        run: |
          docker run --rm "$TRIVY_IMAGE" image --exit-code 0 \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE:${GITHUB_SHA::7}"
      # ด่านตรวจ: พังเมื่อเจอ CRITICAL ที่มีเวอร์ชันแก้แล้ว
      - name: trivy ด่านตรวจ CRITICAL
        run: |
          docker run --rm "$TRIVY_IMAGE" image --exit-code 1 \
            --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE:${GITHUB_SHA::7}"

  # ---------- STAGE: deploy ----------
  deploy-be:
    needs: scan-be
    runs-on: ubuntu-latest
    # deploy BE ทีละรอบ ถ้า merge ติดกัน รอบหลังจะรอรอบแรกเสร็จก่อน (ไม่ยกเลิกรอบที่กำลัง deploy)
    concurrency:
      group: deploy-be
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-be
      APP_DIR: BE
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ถ้าระหว่างนี้มี commit ใหม่ใน main ที่แก้โค้ด BE ด้วย รอบของ commit นั้นจะ deploy แทน
      # รอบนี้ข้ามไป กัน image เก่า deploy ทับ image ใหม่เมื่อสองรอบทำงานเสร็จสลับลำดับกัน
      - name: เช็กว่ายังเป็นโค้ด BE ล่าสุดของ main
        id: latest
        run: |
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- "$APP_DIR" .github/workflows; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main มีโค้ด $APP_DIR ใหม่กว่า commit นี้แล้ว รอบของ commit นั้นจะ deploy แทน"
          fi
      - name: ย้าย :latest มาที่ image ที่ผ่าน scan
        if: steps.latest.outputs.deploy == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker pull "$IMAGE:${GITHUB_SHA::7}"
          docker tag "$IMAGE:${GITHUB_SHA::7}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      # imgURL บอก Render ให้ deploy image :SHA ที่เพิ่งผ่าน scan ตรง ๆ (ต้อง URL-encode: / → %2F, : → %3A)
      # -f ทำให้ job พังเมื่อ Render ตอบกลับเป็น error เช่น 400 เมื่อ imgURL ไม่ตรงกับ image ของ service
      - name: deploy ขึ้น Render
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BE }}
        run: |
          img=$(printf '%s' "docker.io/$IMAGE:${GITHUB_SHA::7}" | sed 's|/|%2F|g; s|:|%3A|g')
          curl -fsS -X POST "$DEPLOY_HOOK&imgURL=$img"

  # ================= FRONTEND =================

  test-fe:
    needs: detect
    if: needs.detect.outputs.has-fe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - name: lint (oxlint ตาม .oxlintrc.json)
        run: npm run lint
      - run: npm test --if-present
      - run: npm run build # build ผ่าน = React compile ได้ไม่มี error

  build-fe:
    needs: [detect, test-fe]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.detect.outputs.fe-changed == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-fe
    steps:
      - uses: actions/checkout@v7
      - name: login Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build และ push :SHA
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA::7}" ./FE
          docker push "$IMAGE:${GITHUB_SHA::7}"

  scan-fe:
    needs: build-fe
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-fe
    steps:
      - name: trivy รายงาน
        run: |
          docker run --rm "$TRIVY_IMAGE" image --exit-code 0 \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE:${GITHUB_SHA::7}"
      - name: trivy ด่านตรวจ CRITICAL
        run: |
          docker run --rm "$TRIVY_IMAGE" image --exit-code 1 \
            --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE:${GITHUB_SHA::7}"

  # ขั้นตอนเดียวกับ deploy-be
  deploy-fe:
    needs: scan-fe
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fe
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-fe
      APP_DIR: FE
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: เช็กว่ายังเป็นโค้ด FE ล่าสุดของ main
        id: latest
        run: |
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- "$APP_DIR" .github/workflows; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main มีโค้ด $APP_DIR ใหม่กว่า commit นี้แล้ว รอบของ commit นั้นจะ deploy แทน"
          fi
      - name: ย้าย :latest มาที่ image ที่ผ่าน scan
        if: steps.latest.outputs.deploy == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker pull "$IMAGE:${GITHUB_SHA::7}"
          docker tag "$IMAGE:${GITHUB_SHA::7}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: deploy ขึ้น Render
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FE }}
        run: |
          img=$(printf '%s' "docker.io/$IMAGE:${GITHUB_SHA::7}" | sed 's|/|%2F|g; s|:|%3A|g')
          curl -fsS -X POST "$DEPLOY_HOOK&imgURL=$img"
